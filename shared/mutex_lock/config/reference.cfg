# Canonical benchmark configuration. FROZEN: every platform of the comparison uses the same file.
# Produced by `bench_mutex --pilot` on the reference machine (candidate file: review, then copy to
# config/reference.cfg). Revise a count only when a configuration is impractical: edit it here, bump
# `version`, and rerun THAT configuration on every platform (--filter). See README, "Fixed workload".
version 1
reference tiendat-wsl: AMD Ryzen 5 6600H with Radeon Graphics; gcc 15.2.0; -std=c++17 -O2 -Wall -Wextra -pthread
target_ms 50
reference_logical_cpus 12
repetitions 10
warmup 1

